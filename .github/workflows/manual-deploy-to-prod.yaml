name: Manual deploy of main to prod
# main needs to have been deployed previously

on:
  workflow_dispatch:

jobs:
  deploy-to-prod:
    permissions:
      contents: write
      id-token: write
    uses: navikt/klage-workflows/.github/workflows/deploy-manually-to-prod.yaml@main
    with:
      prod-deploy-timeout: '20m'
    secrets: inherit